<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل عميل جديد</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f7f7f8;
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    color:#202020;
}

/* =========================
   PAGE
========================= */

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:35px 15px;
}

/* =========================
   CARD
========================= */

.card{
    width:100%;
    max-width:560px;
    background:#fff;
    border-radius:24px;
    padding:32px;
    box-shadow:
        0 10px 40px rgba(0,0,0,.08);
}

/* =========================
   LOGO
========================= */

.logo{
    width:68px;
    height:68px;
    margin:0 auto 14px;
    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #ff9c2b,
            #f26b21
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:30px;
    font-weight:800;

    box-shadow:
        0 8px 22px rgba(242,107,33,.20);
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:30px;
}

.header small{
    color:#999;
    font-size:12px;
}

.header h1{
    margin:8px 0 7px;
    font-size:26px;
    font-weight:800;
}

.header p{
    margin:0;
    color:#888;
    font-size:13px;
    line-height:1.7;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:700;
    color:#333;
}

.required{
    color:#e53935;
}

/* =========================
   INPUT
========================= */

input,
select,
textarea{
    width:100%;

    border:1px solid #dedede;
    border-radius:11px;

    background:#fff;

    padding:13px 14px;

    font-family:inherit;
    font-size:14px;

    color:#333;

    outline:none;

    transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#f58220;

    box-shadow:
        0 0 0 3px rgba(245,130,32,.08);
}

textarea{
    min-height:90px;
    resize:vertical;
}

::placeholder{
    color:#aaa;
}

/* =========================
   PHONE CHECK
========================= */

.phone-check{
    margin-top:6px;

    display:flex;
    align-items:center;
    gap:7px;

    font-size:11px;
    color:#777;
}

.check{
    width:16px;
    height:16px;

    border-radius:4px;

    background:#22c55e;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
}

/* =========================
   LOCATION
========================= */

.location-box{
    display:flex;
    gap:8px;
}

.location-box input{
    flex:1;
}

.location-btn{
    min-width:52px;

    border:1px solid #dedede;
    border-radius:11px;

    background:#fff;

    cursor:pointer;

    font-size:19px;

    transition:.2s;
}

.location-btn:hover{
    background:#fff7ef;
    border-color:#f58220;
}

.location-status{
    margin-top:7px;

    font-size:11px;
    color:#777;
}

/* =========================
   PRODUCT TYPES
========================= */

.product-types{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.product-option{
    position:relative;
}

.product-option input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.product-option label{
    margin:0;

    padding:12px 7px;

    border:1px solid #dedede;
    border-radius:10px;

    text-align:center;

    font-size:12px;

    cursor:pointer;

    transition:.2s;
}

.product-option input:checked + label{
    background:#fff3e8;
    border-color:#f58220;
    color:#e66c0d;
    font-weight:800;
}

/* =========================
   DIVIDER
========================= */

.divider{
    height:1px;
    background:#eee;
    margin:25px 0;
}

/* =========================
   SUBMIT
========================= */

.submit-btn{
    width:100%;

    border:0;
    border-radius:12px;

    padding:15px;

    background:
        linear-gradient(
            135deg,
            #ff9c27,
            #f26a21
        );

    color:#fff;

    font-family:inherit;

    font-size:15px;
    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(242,107,33,.22);

    transition:.2s;
}

.submit-btn:hover{
    transform:translateY(-1px);

    box-shadow:
        0 10px 25px rgba(242,107,33,.28);
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================
   SUCCESS
========================= */

.success{
    display:none;

    margin-top:15px;

    padding:13px;

    border-radius:10px;

    background:#eaf9ef;

    color:#16833c;

    text-align:center;

    font-size:13px;
}

/* =========================
   FOOTER
========================= */

.footer{
    margin-top:20px;

    text-align:center;

    color:#aaa;

    font-size:11px;

    line-height:1.7;
}

/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    .page{
        padding:15px 10px;
    }

    .card{
        padding:23px 17px;
        border-radius:20px;
    }

    .product-types{
        grid-template-columns:1fr 1fr;
    }

    .header h1{
        font-size:23px;
    }

}

</style>
</head>

<body>

<div class="page">

<div class="card">

    <!-- LOGO -->

    <div class="logo">
        A
    </div>


    <!-- HEADER -->

    <div class="header">

        <small>
            إدارة وخدمة العملاء
        </small>

        <h1>
            تسجيل عميل جديد
        </h1>

        <p>
            أدخل بياناتك بالكامل وسيتم تسجيلها في النظام
        </p>

    </div>


    <form id="customerForm">


        <!-- =====================
             CUSTOMER NAME
        ====================== -->

        <div class="form-group">

            <label>
                الاسم بالكامل
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="الاسم رباعي"
                required
            >

        </div>


        <!-- =====================
             PHONE
        ====================== -->

        <div class="form-group">

            <label>
                رقم الهاتف
                <span class="required">*</span>
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="+20 100 000 0000"
                required
            >

            <div class="phone-check">

                <span class="check">✓</span>

                هذا الرقم عليه واتساب

            </div>

        </div>


        <!-- =====================
             ALTERNATIVE PHONE
        ====================== -->

        <div class="form-group">

            <label>
                رقم هاتف بديل
            </label>

            <input
                type="tel"
                id="alternativePhone"
                placeholder="اختياري"
            >

            <div class="phone-check">

                <input
                    type="checkbox"
                    id="alternativeWhatsapp"
                >

                هذا الرقم عليه واتساب

            </div>

        </div>


        <div class="divider"></div>


        <!-- =====================
             GOVERNORATE
        ====================== -->

        <div class="form-group">

            <label>
                المحافظة
                <span class="required">*</span>
            </label>

            <select id="governorate" required>

                <option value="">
                    اختر المحافظة
                </option>

                <option>القاهرة</option>
                <option>الجيزة</option>
                <option>القليوبية</option>
                <option>الإسكندرية</option>
                <option>الدقهلية</option>
                <option>الشرقية</option>
                <option>الغربية</option>
                <option>المنوفية</option>
                <option>البحيرة</option>
                <option>كفر الشيخ</option>
                <option>دمياط</option>
                <option>بورسعيد</option>
                <option>الإسماعيلية</option>
                <option>السويس</option>
                <option>الفيوم</option>
                <option>بني سويف</option>
                <option>المنيا</option>
                <option>أسيوط</option>
                <option>سوهاج</option>
                <option>قنا</option>
                <option>الأقصر</option>
                <option>أسوان</option>

            </select>

        </div>


        <!-- =====================
             ADDRESS
        ====================== -->

        <div class="form-group">

            <label>
                العنوان بالتفصيل
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="address"
                placeholder="المنطقة والشارع وعلامة مميزة"
                required
            >

        </div>


        <!-- =====================
             LOCATION
        ====================== -->

        <div class="form-group">

            <label>
                موقع العميل
            </label>

            <div class="location-box">

                <input
                    type="text"
                    id="location"
                    placeholder="اضغط على زر الموقع"
                    readonly
                >

                <button
                    type="button"
                    class="location-btn"
                    onclick="getLocation()"
                    title="تحديد موقعي"
                >
                    📍
                </button>

            </div>

            <div
                class="location-status"
                id="locationStatus"
            >
                لم يتم تحديد الموقع بعد
            </div>

        </div>


        <div class="divider"></div>


        <!-- =====================
             PRODUCT TYPE
        ====================== -->

        <div class="form-group">

            <label>
                نوع المنتج
                <span class="required">*</span>
            </label>

            <div class="product-types">

                <div class="product-option">

                    <input
                        type="radio"
                        name="productType"
                        id="phoneProduct"
                        value="موبايل"
                        required
                    >

                    <label for="phoneProduct">
                        📱 موبايل
                    </label>

                </div>


                <div class="product-option">

                    <input
                        type="radio"
                        name="productType"
                        id="laptopProduct"
                        value="لابتوب"
                    >

                    <label for="laptopProduct">
                        💻 لابتوب
                    </label>

                </div>


                <div class="product-option">

                    <input
                        type="radio"
                        name="productType"
                        id="tabletProduct"
                        value="تابلت"
                    >

                    <label for="tabletProduct">
                        📲 تابلت
                    </label>

                </div>


                <div class="product-option">

                    <input
                        type="radio"
                        name="productType"
                        id="otherProduct"
                        value="أخرى"
                    >

                    <label for="otherProduct">
                        📦 أخرى
                    </label>

                </div>

            </div>

        </div>


        <!-- =====================
             PRODUCT MODEL
        ====================== -->

        <div class="form-group">

            <label>
                اسم / موديل المنتج
            </label>

            <input
                type="text"
                id="productModel"
                placeholder="مثال: iPhone 15 Pro Max"
            >

        </div>


        <!-- =====================
             NOTES
        ====================== -->

        <div class="form-group">

            <label>
                ملاحظات إضافية
            </label>

            <textarea
                id="notes"
                placeholder="اكتب أي تفاصيل إضافية تريد إخبارنا بها..."
            ></textarea>

        </div>


        <!-- =====================
             SUBMIT
        ====================== -->

        <button
            type="submit"
            class="submit-btn"
            id="submitBtn"
        >
            تسجيل بيانات العميل
        </button>


        <div
            class="success"
            id="successMessage"
        >
            ✓ تم تسجيل بياناتك بنجاح
        </div>


    </form>


    <div class="footer">

        بياناتك يتم إرسالها بشكل آمن إلى نظام خدمة العملاء

        <br>

        Customer Registration System

    </div>

</div>

</div>


<script>

/*
====================================================
   n8n WEBHOOK
====================================================

ضع هنا رابط Webhook الخاص بـ n8n

مثال:

const WEBHOOK_URL =
"https://your-n8n-domain.com/webhook/customer";

*/

const WEBHOOK_URL = "https://mahmoud0987654321.app.n8n.cloud/webhook-test/Dashboard_log";


/* =========================
   GET LOCATION
========================= */

function getLocation(){

    const status =
        document.getElementById("locationStatus");

    const locationInput =
        document.getElementById("location");


    if(!navigator.geolocation){

        status.textContent =
            "المتصفح لا يدعم تحديد الموقع";

        return;
    }


    status.textContent =
        "جاري تحديد موقعك...";


    navigator.geolocation.getCurrentPosition(

        function(position){

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            locationInput.value =
                `${lat}, ${lng}`;


            status.innerHTML =
                `✓ تم تحديد الموقع بنجاح`;

        },

        function(error){

            status.textContent =
                "لم نتمكن من تحديد الموقع. تأكد من السماح للموقع.";

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}


/* =========================
   FORM SUBMIT
========================= */

document
.getElementById("customerForm")
.addEventListener("submit", async function(e){

    e.preventDefault();


    const submitBtn =
        document.getElementById("submitBtn");

    submitBtn.disabled = true;

    submitBtn.textContent =
        "جاري تسجيل البيانات...";


    const productType =
        document.querySelector(
            'input[name="productType"]:checked'
        )?.value || "";


    /* البيانات */

    const customerData = {

        customer_name:
            document.getElementById("customerName").value.trim(),

        phone:
            document.getElementById("phone").value.trim(),

        alternative_phone:
            document.getElementById("alternativePhone").value.trim(),

        alternative_whatsapp:
            document.getElementById("alternativeWhatsapp").checked,

        governorate:
            document.getElementById("governorate").value,

        address:
            document.getElementById("address").value.trim(),

        location:
            document.getElementById("location").value,

        product_type:
            productType,

        product_model:
            document.getElementById("productModel").value.trim(),

        notes:
            document.getElementById("notes").value.trim(),

        submitted_at:
            new Date().toISOString()

    };


    try{

        /*
        ==========================================
        إرسال البيانات إلى n8n
        ==========================================
        */

        if(WEBHOOK_URL !== "YOUR_N8N_WEBHOOK_URL"){

            const response =
                await fetch(WEBHOOK_URL, {

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:
                        JSON.stringify(customerData)

                });


            if(!response.ok){

                throw new Error(
                    "Webhook Error"
                );

            }

        }


        /* نجاح */

        document
        .getElementById("successMessage")
        .style.display = "block";


        submitBtn.textContent =
            "✓ تم تسجيل بيانات العميل";


        console.log(
            "Customer Data:",
            customerData
        );


    }catch(error){

        console.error(error);

        alert(
            "حدث خطأ أثناء إرسال البيانات. حاول مرة أخرى."
        );

        submitBtn.disabled = false;

        submitBtn.textContent =
            "تسجيل بيانات العميل";

    }

});

</script>

</body>
</html>
